<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W3 Dev Platform</title>

<style>
body{
  margin:0;
  background:#050811;
  color:#e6edf3;
  font-family:ui-monospace, monospace;
}

/* HEADER */
header{
  padding:14px 20px;
  border-bottom:1px solid #0f172a;
}
header b{color:#00ffd0;}

/* SEARCH */
#search{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#0a0f1c;
  border:1px solid #111;
  color:#00ffd0;
  margin-bottom:15px;
}

/* LAYOUT */
.wrapper{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.main{
  display:grid;
  grid-template-columns:220px 1fr 260px;
  border:1px solid #111;
  border-radius:14px;
  overflow:hidden;
}

/* LEFT */
#nav{
  background:#050811;
  border-right:1px solid #111;
}

.item{
  padding:10px 14px;
  border-bottom:1px solid #0f172a;
  cursor:pointer;
  color:#7c8591;
}
.item:hover{color:#00ffd0;background:#0a0f1c;}
.item.active{
  color:#00ffd0;
  border-left:3px solid #00ffd0;
}

/* CENTER */
#center{
  padding:20px;
}

/* RIGHT */
#right{
  background:#050811;
  border-left:1px solid #111;
  padding:15px;
}

.node{
  border:1px solid #00ffd033;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}

.lock{border-color:#00ffd0;}

/* TEXT */
h2{color:#00ffd0;margin-top:0;}
.key{color:#00ffd0;}
.muted{color:#7c8591;}

button{
  margin-right:6px;
  background:#0a0f1c;
  border:1px solid #111;
  color:#00ffd0;
  padding:6px 10px;
  border-radius:6px;
}

/* LOADING */
#loading{
  position:fixed;
  top:10px;
  right:10px;
  background:#00ffd0;
  color:#000;
  padding:6px 12px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<header><b>W3 Dev Platform</b></header>

<div class="wrapper">

<input id="search" placeholder="🔍 Search...">

<div class="main">
  <div id="nav"></div>
  <div id="center"></div>
  <div id="right"></div>
</div>

<canvas id="graph" height="280"></canvas>

</div>

<div id="loading">loading...</div>

<script>
const REPO="BBXDOO/W3_HB_team_BXCGICOG";
const BRANCH="refactor/v0.2";

let state={
  path:[],
  stack:[],
  locked:[],
  loading:false
};

const nav=document.getElementById("nav");
const center=document.getElementById("center");
const right=document.getElementById("right");

/* LOAD */
async function load(path=""){
  state.loading=true;
  showLoading(true);

  try{
    const url=`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`;
    const res=await fetch(url);
    const data=await res.json();
    buildNav(data,path);
  }catch(e){
    center.innerHTML="โหลดไม่สำเร็จ";
  }

  state.loading=false;
  showLoading(false);
}

/* NAV */
function buildNav(data,path){
  nav.innerHTML="";

  data.forEach((x,i)=>{
    let el=document.createElement("div");
    el.className="item";
    el.innerText=(i+1)+". "+x.name;

    el.onclick=(e)=>handleClick(e,x,path);
    nav.appendChild(el);
  });

  render();
}

/* CLICK */
async function handleClick(e,item,currentPath){

  if(state.loading) return;

  document.querySelectorAll(".item").forEach(el=>el.classList.remove("active"));
  e.target.classList.add("active");

  const fullPath = currentPath ? currentPath+"/"+item.name : item.name;

  state.stack.push(fullPath);
  state.path.push(item.name);

  if(item.type==="dir"){
    await load(fullPath);
  }else{
    await showFile(item);
  }

  render();
}

/* FILE */
async function showFile(file){
  showLoading(true);
  const res=await fetch(file.download_url);
  const text=await res.text();

  center.innerHTML = `
    <h2>${file.name}</h2>
    <pre style="font-size:12px;white-space:pre-wrap;">
${escapeHtml(text.slice(0,3000))}
    </pre>
  `;
  showLoading(false);
}

/* RENDER */
function render(){
  center.innerHTML = `
    <div style="margin-bottom:10px;">
      <button onclick="back()">⬅</button>
      <button onclick="reset()">Reset</button>
      <button onclick="edit()">Edit</button>
    </div>

    <div class="muted">/${state.path.join("/")}</div>
    <h2>STACK</h2>
  `;

  state.stack.forEach((x,i)=>{
    center.innerHTML+=`<p><span class="key">${i+1}.</span> ${x}</p>`;
  });

  right.innerHTML="<h2>NODE</h2>";

  if(state.stack.length){
    right.innerHTML+=`<div class="node">${state.stack.at(-1)}</div>`;
  }

  state.locked.forEach(x=>{
    right.innerHTML+=`<div class="node lock">🔒 ${x}</div>`;
  });
}

/* BACK */
function back(){
  state.path.pop();
  state.stack.pop();
  load(state.path.join("/"));
}

/* RESET */
function reset(){
  state.path=[];
  state.stack=[];
  load("");
}

/* EDIT */
function edit(){
  const p=state.stack.at(-1)||"";
  window.open(`https://github.com/${REPO}/blob/${BRANCH}/${p}`);
}

/* SEARCH */
document.getElementById("search").oninput=e=>{
  let v=e.target.value.toLowerCase();
  document.querySelectorAll(".item").forEach(el=>{
    el.style.display=el.innerText.toLowerCase().includes(v)?"":"none";
  });
};

/* GRAPH (จัดใหม่ ไม่กระจุก) */
const c=document.getElementById("graph");
const ctx=c.getContext("2d");

function draw(names){
  const w=c.clientWidth;
  const h=280;
  c.width=w;
  c.height=h;

  ctx.clearRect(0,0,w,h);

  let cols=Math.ceil(Math.sqrt(names.length));
  let gapX=w/(cols+1);
  let gapY=h/(cols+1);

  names.forEach((x,i)=>{
    let row=Math.floor(i/cols);
    let col=i%cols;

    let x1=(col+1)*gapX;
    let y1=(row+1)*gapY;

    ctx.fillStyle="#00ffd0";
    ctx.fillRect(x1,y1,4,4);

    ctx.fillStyle="#9ff";
    ctx.fillText(x.name,x1+6,y1);
  });
}

/* LOADING */
function showLoading(v){
  document.getElementById("loading").style.display = v ? "block" : "none";
}

/* UTIL */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

/* INIT */
load();
</script>

</body>
</html>
