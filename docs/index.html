<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W3 Dev Platform</title>

<style>
body{
  margin:0;
  background:#050811;
  color:#e6edf3;
  font-family:ui-monospace, monospace;
}

/* HEADER */
header{
  padding:14px 20px;
  border-bottom:1px solid #0f172a;
}
header b{color:#00ffd0;}

/* SEARCH */
#search{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#0a0f1c;
  border:1px solid #111;
  color:#00ffd0;
  margin-bottom:15px;
}

/* LAYOUT */
.wrapper{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.main{
  display:grid;
  grid-template-columns: 220px 1fr 260px;
  border:1px solid #111;
  border-radius:14px;
  overflow:hidden;
}

/* LEFT */
#nav{
  background:#050811;
  border-right:1px solid #111;
}

.item{
  padding:10px 14px;
  border-bottom:1px solid #0f172a;
  cursor:pointer;
  color:#7c8591;
}
.item:hover{color:#00ffd0;background:#0a0f1c;}
.item.active{color:#00ffd0;}

/* CENTER */
#center{
  padding:20px;
}

/* RIGHT */
#right{
  background:#050811;
  border-left:1px solid #111;
  padding:15px;
}

.node{
  border:1px solid #00ffd033;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}

.lock{border-color:#00ffd0;}

/* GRAPH */
canvas{
  margin-top:25px;
  background:#050811;
  border-radius:12px;
}

/* TEXT */
h2{color:#00ffd0;margin-top:0;}
.key{color:#00ffd0;}
.value{color:#7ee787;}
.muted{color:#7c8591;}
</style>
</head>

<body>

<header>
  <b>W3 Dev Platform</b>
</header>

<div class="wrapper">

<input id="search" placeholder="🔍 Search...">

<div class="main">
  <div id="nav"></div>
  <div id="center"></div>
  <div id="right"></div>
</div>

<canvas id="graph" height="280"></canvas>

<pre id="out"></pre>

</div>

<script>
const REPO="BBXDOO/W3_HB_team_BXCGICOG";
const BRANCH="refactor/v0.2";
const API=`https://api.github.com/repos/${REPO}/contents/?ref=${BRANCH}`;

let FILES=[];
let state={
  current:null,
  stack:[],
  locked:[]
};

const nav=document.getElementById("nav");
const center=document.getElementById("center");
const right=document.getElementById("right");

/* LOAD */
fetch(API).then(r=>r.json()).then(d=>{
  FILES=d.filter(x=>x.type==="dir");
  build();
  draw(FILES);
});

/* BUILD NAV */
function build(){
  nav.innerHTML="";
  FILES.forEach((x,i)=>{
    let el=document.createElement("div");
    el.className="item";
    el.innerText=(i+1)+". "+x.name;

    el.onclick=()=>{
      state.current=x.name;
      if(!state.stack.includes(x.name)){
        state.stack.push(x.name);
      }
      render();
    };

    el.ondblclick=()=>{
      if(!state.locked.includes(x.name)){
        state.locked.push(x.name);
      }
      render();
    };

    nav.appendChild(el);
  });
  render();
}

/* RENDER */
function render(){
  /* CENTER */
  center.innerHTML="<h2>STACK</h2>";
  state.stack.forEach((x,i)=>{
    center.innerHTML+=`<p><span class="key">${i+1}.</span> ${x}</p>`;
  });

  /* RIGHT */
  right.innerHTML="<h2>NODE</h2>";

  state.stack.slice(-1).forEach(x=>{
    right.innerHTML+=`<div class="node">${x}</div>`;
  });

  state.locked.forEach(x=>{
    right.innerHTML+=`<div class="node lock">🔒 ${x}</div>`;
  });
}

/* SEARCH */
document.getElementById("search").oninput=e=>{
  let v=e.target.value.toLowerCase();
  document.querySelectorAll(".item").forEach(el=>{
    el.style.display=el.innerText.toLowerCase().includes(v)?"":"none";
  });
};

/* GRAPH */
const c=document.getElementById("graph");
const ctx=c.getContext("2d");

function draw(d){
  const w=c.clientWidth;
  const h=280;

  c.width=w;
  c.height=h;

  ctx.clearRect(0,0,w,h);

  let gap=360/d.length;

  d.forEach((x,i)=>{
    let x1=40+i*gap;
    let y1=140+Math.sin(i)*40;

    ctx.fillStyle="#00ffd0";
    ctx.fillRect(x1,y1,4,4);

    ctx.fillStyle="#9ff";
    ctx.fillText(x.name,x1+6,y1);
  });
}
</script>

</body>
</html>
