name: Validate JSON Files

on:
  push:
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # ไม่ต้องติดตั้ง ajv-cli แบบ global เพื่อลดเวลา setup

      - name: ⚙️ Validate JSON Syntax (All Files)
        run: |
          # ใช้ -print0 ร่วมกับ read -d '' เพื่อรองรับชื่อไฟล์ที่มีช่องว่าง
          find . -name "*.json" -type f -not -path "./node_modules/*" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
            echo "Checking syntax: $file"
            jq . "$file" > /dev/null || { echo "❌ JSON Syntax Error in $file"; exit 1; }
          done

      - name: ✨ Validate Data against Schemas
        run: |
          # ค้นหา schema files และรัน ajv ผ่าน npx (ไม่ต้องเสียเวลาลง global)
          find . -name "*.schema.json" -type f -print0 | while IFS= read -r -d '' schema_file; do
            data_file="${schema_file%.schema.json}.json"

            if [ -f "$data_file" ]; then
              echo "-----------------------------------"
              echo "🔍 Validating: $data_file"
              echo "📄 Using Schema: $schema_file"
              
              # --spec=draft7 หรือปรับตาม schema version ที่ใช้
              # --all-errors เพื่อแสดงผลความผิดพลาดทั้งหมดในรอบเดียว
              npx ajv-cli validate -s "$schema_file" -d "$data_file" --spec=draft7 --strict=false || { 
                echo "❌ Schema Validation Failed for $data_file"
                exit 1 
              }
            else
              echo "⚠️ Warning: No data file found for $schema_file"
            fi
          done
