name: JSON Validation Workflow

on:
  push:
    branches:
      - main
      - refactor/v0.2
    paths:
      - "*.json"
      - "*.schema.json"
      - "**/*.json"
      - "**/*.schema.json"
      - ".github/workflows/validate-json.yml"
      - "requirements-dev.txt"

  pull_request:
    branches:
      - main
      - refactor/v0.2
    paths:
      - "*.json"
      - "*.schema.json"
      - "**/*.json"
      - "**/*.schema.json"
      - ".github/workflows/validate-json.yml"
      - "requirements-dev.txt"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate JSON files against matching schemas
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft7Validator, Draft202012Validator
          from jsonschema.exceptions import SchemaError, ValidationError


          def choose_validator(schema: dict):
              schema_uri = str(schema.get("$schema", "")).lower()

              if "draft-07" in schema_uri or "draft7" in schema_uri:
                  return Draft7Validator

              if "2020-12" in schema_uri or "draft/2020" in schema_uri:
                  return Draft202012Validator

              # Default to Draft7 because several repo schemas are older/simple schemas.
              return Draft7Validator


          checked = 0
          missing_data = []

          for schema_file in sorted(Path(".").rglob("*.schema.json")):
              data_file = Path(str(schema_file).replace(".schema.json", ".json"))

              if not data_file.exists():
                  missing_data.append(str(schema_file))
                  print(f"Warning: no data file found for {schema_file}")
                  continue

              print("--------------------------------------")
              print(f"Validating: {data_file}")
              print(f"Using schema: {schema_file}")

              try:
                  schema = json.loads(schema_file.read_text(encoding="utf-8"))
                  data = json.loads(data_file.read_text(encoding="utf-8"))

                  validator_cls = choose_validator(schema)
                  validator_cls.check_schema(schema)
                  validator_cls(schema).validate(data)

                  print(f"{data_file} valid")
                  checked += 1

              except json.JSONDecodeError as exc:
                  print(f"JSON decode error in {schema_file if 'schema' in str(exc).lower() else data_file}: {exc}")
                  raise SystemExit(1)

              except SchemaError as exc:
                  print(f"schema {schema_file} is invalid")
                  print(exc)
                  raise SystemExit(1)

              except ValidationError as exc:
                  print(f"{data_file} is invalid against {schema_file}")
                  print(exc)
                  raise SystemExit(1)

          if checked == 0 and not missing_data:
              print("No *.schema.json files found. Nothing to validate.")

          print("--------------------------------------")
          print(f"Validated JSON/schema pairs: {checked}")
          print(f"Schemas without matching data file: {len(missing_data)}")
          PY
