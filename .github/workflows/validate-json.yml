name: JSON Validation Workflow

on:
  push:
    branches:
      - main
      - refactor/v0.2
    paths:
      - "*.json"
      - "*.schema.json"
      - "**/*.json"
      - "**/*.schema.json"
      - ".github/workflows/validate-json.yml"

  pull_request:
    branches:
      - main
      - refactor/v0.2
    paths:
      - "*.json"
      - "*.schema.json"
      - "**/*.json"
      - "**/*.schema.json"
      - ".github/workflows/validate-json.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AJV CLI
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON files against matching schemas
        shell: bash
        run: |
          set -euo pipefail

          found_schema=false

          while IFS= read -r -d '' schema_file; do
            found_schema=true
            data_file="${schema_file%.schema.json}.json"

            if [ ! -f "$data_file" ]; then
              echo "Warning: no data file found for $schema_file"
              continue
            fi

            echo "--------------------------------------"
            echo "Validating: $data_file"
            echo "Using schema: $schema_file"

            schema_text="$(cat "$schema_file")"

            if echo "$schema_text" | grep -q "draft-07"; then
              ajv validate \
                -s "$schema_file" \
                -d "$data_file" \
                --spec=draft7 \
                --strict=false
            else
              ajv validate \
                -s "$schema_file" \
                -d "$data_file" \
                --spec=draft2020 \
                --strict=false
            fi
          done < <(find . -name "*.schema.json" -type f -print0)

          if [ "$found_schema" = false ]; then
            echo "No *.schema.json files found. Nothing to validate."
          fi
