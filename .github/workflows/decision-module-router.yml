name: decision-module-router

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

jobs:
  route-decision-issue:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.title, '[DECISION]')
    runs-on: ubuntu-latest
    steps:
      - name: Add review labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;

            const labels = [
              'decision-needed',
              'review:bbx19',
              'review:gemini',
              'review:copilot-gm'
            ];

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels,
              });
            } catch (error) {
              core.info(`addLabels skipped/error: ${error.message}`);
            }

      - name: Create or update checklist comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const marker = '<!-- decision-router-checklist -->';

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(c => (c.body || '').includes(marker));

            const body = [
              marker,
              'Decision workflow triggered for this issue.',
              '',
              '## Auto checklist',
              '- [ ] BBX19 review requested',
              '- [ ] Gemini validation requested',
              '- [ ] Copilot-Gm governance review requested',
              '- [ ] BBX19 responded',
              '- [ ] Gemini responded',
              '- [ ] Copilot-Gm responded',
              '- [ ] Contract-only scope confirmed',
              '- [ ] Runtime mutation explicitly blocked',
              '- [ ] Testcases requested before implementation',
              '',
              '## Required module response format',
              '',
              'Use one of these strict formats:',
              '',
              '### Format A',
              'Module: BBX19',
              'Decision: APPROVE',
              'Reason: ...',
              'Conditions: ...',
              'Date: 2026-06-13',
              '',
              '### Format B',
              'approved-by: BBX19',
              'decision: APPROVE',
              'reason: ...',
              'date: 2026-06-13',
              '',
              'Allowed decisions: APPROVE, REJECT, REVIEW_REQUIRED',
              '',
              'Target: Option B only. Do not approve runtime mutation in this issue.',
              '',
              'To call modules manually, comment with: @BBX19 @Gemini @Copilot-Gm'
            ].join('\n');

            if (existing) {
              if ((existing.body || '') !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                core.info('Checklist already up to date.');
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  route-module-call:
    if: >-
      github.event_name == 'issue_comment' &&
      (
        contains(github.event.comment.body, '@BBX19') ||
        contains(github.event.comment.body, '@Gemini') ||
        contains(github.event.comment.body, '@Copilot-Gm')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Detect requested modules
        id: detect
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.comment.body || '';
            const modules = [];
            if (body.includes('@BBX19')) modules.push('BBX19');
            if (body.includes('@Gemini')) modules.push('Gemini');
            if (body.includes('@Copilot-Gm')) modules.push('Copilot-Gm');
            core.setOutput('modules', JSON.stringify(modules));
            core.setOutput('comment_id', String(context.payload.comment.id));

      - name: Create or update acknowledge comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const sourceCommentId = `${{ steps.detect.outputs.comment_id }}`;
            const modules = JSON.parse(`${{ steps.detect.outputs.modules }}`);
            const marker = `<!-- decision-router-ack:${sourceCommentId} -->`;

            const body = [
              marker,
              'Module request received.',
              '',
              `Detected modules: ${modules.join(', ') || 'none'}`,
              '',
              'Routing status:',
              '- labels/checklist: enabled',
              '- strict decision parsing: enabled',
              '- AI/API dispatch: enabled when webhook secrets are configured',
              '- summary/checklist sync: enabled',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              if ((existing.body || '') !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                core.info('Ack already up to date.');
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Dispatch to external AI responder
        if: ${{ vars.MODULE_WEBHOOK_ENABLED == 'true' }}
        env:
          MODULE_WEBHOOK_URL: ${{ secrets.MODULE_WEBHOOK_URL }}
          MODULE_WEBHOOK_TOKEN: ${{ secrets.MODULE_WEBHOOK_TOKEN }}
          MODULES: ${{ steps.detect.outputs.modules }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          url = os.environ.get("MODULE_WEBHOOK_URL", "").strip()
          token = os.environ.get("MODULE_WEBHOOK_TOKEN", "").strip()

          if not url or not token:
              print("Webhook dispatch skipped: missing MODULE_WEBHOOK_URL or MODULE_WEBHOOK_TOKEN")
              sys.exit(0)

          payload = {
              "repository": os.environ["REPO"],
              "issue_number": os.environ["ISSUE_NUMBER"],
              "issue_title": os.environ["ISSUE_TITLE"],
              "issue_body": os.environ["ISSUE_BODY"],
              "issue_url": os.environ["ISSUE_URL"],
              "comment_body": os.environ["COMMENT_BODY"],
              "modules": json.loads(os.environ["MODULES"] or "[]"),
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}",
              },
              method="POST",
          )

          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode("utf-8"))
          PY

  summarize-approvals:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.title, '[DECISION]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse module decisions and sync summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const summaryMarker = '<!-- decision-router-summary -->';
            const checklistMarker = '<!-- decision-router-checklist -->';

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const modules = ['BBX19', 'Gemini', 'Copilot-Gm'];
            const stateLabels = [
              'decision:pending-review',
              'decision:approved-contract-phase',
              'decision:needs-revision'
            ];

            const decisions = {};
            for (const m of modules) {
              decisions[m] = {
                responded: false,
                approve: false,
                reject: false,
                reviewRequired: false,
                matchedCommentUrl: null
              };
            }

            function extractField(body, field) {
              const regex = new RegExp(`^${field}\\s*:\\s*(.+)$`, 'im');
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            }

            function normalizeDecision(value) {
              if (!value) return null;
              const v = value.trim().toUpperCase();
              if (v === 'APPROVE') return 'APPROVE';
              if (v === 'REJECT') return 'REJECT';
              if (v === 'REVIEW_REQUIRED') return 'REVIEW_REQUIRED';
              return null;
            }

            function detectModule(body) {
              const moduleField = extractField(body, 'Module');
              const approvedByField = extractField(body, 'approved-by');
              const candidate = moduleField || approvedByField;
              if (!candidate) return null;

              const normalized = candidate.trim();
              if (modules.includes(normalized)) return normalized;
              return null;
            }

            for (const c of comments) {
              const body = c.body || '';
              if (
                body.includes(summaryMarker) ||
                body.includes(checklistMarker) ||
                body.includes('decision-router-ack:')
              ) {
                continue;
              }

              const moduleName = detectModule(body);
              if (!moduleName) continue;

              const decisionField =
                normalizeDecision(extractField(body, 'Decision')) ||
                normalizeDecision(extractField(body, 'decision'));

              decisions[moduleName].responded = true;
              decisions[moduleName].matchedCommentUrl = c.html_url;

              if (decisionField === 'APPROVE') decisions[moduleName].approve = true;
              if (decisionField === 'REJECT') decisions[moduleName].reject = true;
              if (decisionField === 'REVIEW_REQUIRED') decisions[moduleName].reviewRequired = true;
            }

            const approvedModules = modules.filter(m => decisions[m].approve);
            const rejectedModules = modules.filter(m => decisions[m].reject);
            const reviewRequiredModules = modules.filter(m => decisions[m].reviewRequired);
            const respondedModules = modules.filter(m => decisions[m].responded);
            const pendingModules = modules.filter(m => !decisions[m].responded);

            let finalLabel = 'decision:pending-review';
            if (rejectedModules.length > 0) {
              finalLabel = 'decision:needs-revision';
            } else if (approvedModules.length >= 2) {
              finalLabel = 'decision:approved-contract-phase';
            }

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });

            const currentLabels = (issue.data.labels || []).map(l => typeof l === 'string' ? l : l.name).filter(Boolean);

            for (const label of currentLabels) {
              if (stateLabels.includes(label) && label !== finalLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number,
                    name: label,
                  });
                } catch (error) {
                  core.info(`removeLabel skipped/error: ${error.message}`);
                }
              }
            }

            if (!currentLabels.includes(finalLabel)) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [finalLabel],
                });
              } catch (error) {
                core.info(`final addLabels skipped/error: ${error.message}`);
              }
            }

            const summaryBody = [
              summaryMarker,
              '## Decision status summary',
              '',
              `- Responded: ${respondedModules.join(', ') || 'none'}`,
              `- Approved: ${approvedModules.join(', ') || 'none'}`,
              `- Rejected: ${rejectedModules.join(', ') || 'none'}`,
              `- Review required: ${reviewRequiredModules.join(', ') || 'none'}`,
              `- Pending: ${pendingModules.join(', ') || 'none'}`,
              '',
              `Current state label: ${finalLabel}`,
              '',
              'Rule:',
              '- any REJECT => needs revision',
              '- 2 or more APPROVE => approved contract phase',
              '- otherwise => pending review',
            ].join('\n');

            const existingSummary = comments.find(c => (c.body || '').includes(summaryMarker));

            if (existingSummary) {
              if ((existingSummary.body || '') !== summaryBody) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingSummary.id,
                  body: summaryBody,
                });
              } else {
                core.info('Summary already up to date.');
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: summaryBody,
              });
            }

            const checklistComment = comments.find(c => (c.body || '').includes(checklistMarker));
            if (checklistComment) {
              const yes = '- [x]';
              const no = '- [ ]';

              let updatedChecklist = checklistComment.body || '';

              const replaceLine = (text, label, checked) => {
                const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`^- \\[[ x]\\] ${escaped}$`, 'm');
                const replacement = `${checked ? yes : no} ${label}`;
                if (regex.test(text)) {
                  return text.replace(regex, replacement);
                }
                return text;
              };

              updatedChecklist = replaceLine(updatedChecklist, 'BBX19 responded', decisions['BBX19'].responded);
              updatedChecklist = replaceLine(updatedChecklist, 'Gemini responded', decisions['Gemini'].responded);
              updatedChecklist = replaceLine(updatedChecklist, 'Copilot-Gm responded', decisions['Copilot-Gm'].responded);
              updatedChecklist = replaceLine(updatedChecklist, 'Contract-only scope confirmed', approvedModules.length >= 2 && rejectedModules.length === 0);
              updatedChecklist = replaceLine(updatedChecklist, 'Runtime mutation explicitly blocked', true);
              updatedChecklist = replaceLine(updatedChecklist, 'Testcases requested before implementation', true);

              if ((checklistComment.body || '') !== updatedChecklist) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: checklistComment.id,
                  body: updatedChecklist,
                });
              } else {
                core.info('Checklist sync not needed.');
              }
            }
