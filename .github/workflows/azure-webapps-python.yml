name: W3Lgu-Refactor-Pipeline-v0.2

on:
  push:
    branches: [ "refactor/v0.2" ]
  pull_request:
    branches: [ "refactor/v0.2" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Verify Logic Structure'
        id: check_logic
        run: |
          # ตรวจสอบความพร้อมของ Module หลัก
          if [ -d "./modules/REDR" ] && [ -d "./modules/DTML" ]; then
            echo "status=ready" >> $GITHUB_OUTPUT
          else
            echo "status=incomplete" >> $GITHUB_OUTPUT
          fi

      - name: 'Process Logic Through Void'
        if: steps.check_logic.outputs.status == 'ready'
        run: |
          echo "Initiating W3Lgu Logic Stream..."
          # ส่วนนี้คือจุดที่ลมใน Void เริ่มทำงาน
          # สามารถใส่คำสั่งรันเทสหรือเตรียม Data ตรงนี้ได้

      # ตัวอย่างการส่งค่าไป Azure (ปรับตามความจำเป็น)
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'W3-HB-Logic-App' # เปลี่ยนเป็นชื่อแอปของคุณ
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
