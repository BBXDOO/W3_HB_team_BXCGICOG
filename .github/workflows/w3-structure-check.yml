name: W3 Ambiguous Structure Check

on:
  pull_request:
    branches:
      - refactor/v0.2
    paths:
      - "core/**"
      - "protocol/**"
      - "wx/**"
      - "docs/**"
      - ".github/workflows/w3-structure-check.yml"

  push:
    branches:
      - refactor/v0.2
    paths:
      - "core/**"
      - "protocol/**"
      - "wx/**"
      - "docs/**"
      - ".github/workflows/w3-structure-check.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-structure:
    name: Observe structure and preserve evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create observation area
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.w3_observe"

          echo "state:observe" \
            > "${GITHUB_WORKSPACE}/.w3_observe/summary.txt"

          echo "mutated:false" \
            >> "${GITHUB_WORKSPACE}/.w3_observe/summary.txt"

          echo "review:true" \
            >> "${GITHUB_WORKSPACE}/.w3_observe/summary.txt"

      - name: Record changed paths
        run: |
          git status --short \
            > "${GITHUB_WORKSPACE}/.w3_observe/git_status.txt"

          git diff --name-only HEAD^ HEAD \
            > "${GITHUB_WORKSPACE}/.w3_observe/changed_paths.txt" \
            || true

      - name: Run minimum structure checks
        id: structure_check
        continue-on-error: true
        run: |
          python - << 'PY'
          from pathlib import Path
          import os

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          observation_dir = workspace / ".w3_observe"

          required_roots = [
              "core",
              "protocol",
              "wx",
              "docs",
          ]

          failures = []

          for root in required_roots:
              if not (workspace / root).exists():
                  failures.append(f"missing_root:{root}")

          report = observation_dir / "structure_check.txt"

          if failures:
              report.write_text(
                  "status:review_required\n"
                  + "\n".join(failures)
                  + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(1)

          report.write_text(
              "status:completed\n"
              "observation:minimum structure present\n"
              "mutated:false\n"
              "review:false\n",
              encoding="utf-8",
          )
          PY

      - name: Verify observation evidence
        if: always()
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== GITHUB WORKSPACE ==="
          echo "${GITHUB_WORKSPACE}"

          echo "=== OBSERVATION DIRECTORY ==="
          ls -la "${GITHUB_WORKSPACE}/.w3_observe"

          echo "=== OBSERVATION FILES ==="
          find "${GITHUB_WORKSPACE}/.w3_observe" \
            -maxdepth 2 \
            -type f \
            -print

          echo "=== SUMMARY ==="
          cat "${GITHUB_WORKSPACE}/.w3_observe/summary.txt"

          echo "=== STRUCTURE CHECK ==="
          cat "${GITHUB_WORKSPACE}/.w3_observe/structure_check.txt" || true

          test -d "${GITHUB_WORKSPACE}/.w3_observe"
          test -n "$(
            find "${GITHUB_WORKSPACE}/.w3_observe" \
              -type f \
              -print \
              -quit
          )"

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-structure-observation
          path: ${{ github.workspace }}/.w3_observe/
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop when structure check fails
        if: steps.structure_check.outcome == 'failure'
        run: |
          echo "Structure check failed."
          cat "${GITHUB_WORKSPACE}/.w3_observe/structure_check.txt"
          exit 1
