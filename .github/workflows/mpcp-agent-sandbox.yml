name: MPCP Agent Sandbox

on:
  workflow_dispatch:
  pull_request:
    branches: [refactor/v0.2]
    paths:
      - 'protocol/mpcp/**'
      - 'protocol/w3lgu/**'
      - 'protocol/files_void/**'
      - 'src/core/blueprint.py'
      - 'src/core/condien.py'
      - 'src/core/condien_store.py'
      - 'tools/mpcp_sandbox.py'
      - 'tools/mpcp_papers.py'
      - 'tools/mpcp_condien.py'
      - 'tools/agent_sandbox/**'
      - 'tests/test_mpcp_agent_sandbox.py'
      - 'tests/test_mpcp_paper_runtime.py'
      - 'tests/test_mpcp_condien_equipment.py'
      - '.github/workflows/mpcp-agent-sandbox.yml'

permissions:
  contents: read

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sandbox regressions
        run: python -m unittest discover -s tests -p test_mpcp_agent_sandbox.py -v
      - name: Install Paper test dependency
        run: python -m pip install pytest
      - name: Paper and File.void regressions
        run: python -m pytest -q tests/test_mpcp_paper_runtime.py tests/test_mpcp_condien_equipment.py tests/test_file_void_tool.py
      - name: Existing MPCP and Blueprint foundations
        run: |
          python protocol/mpcp/runtime_sanity_sweep.py
          python protocol/mpcp/test_condien_blueprint.py
      - name: Run real local setup
        run: python tools/mpcp_sandbox.py --request tools/agent_sandbox/local_setup.json --output local_workspace/ci-sandbox --execute
      - name: Run real event-bound text Papers
        run: python tools/mpcp_papers.py --request tools/agent_sandbox/paper_pack.json --output local_workspace/ci-papers --execute
      - name: Persist Condien and use it from another process
        run: |
          python tools/mpcp_condien.py --store local_workspace/ci-context/context.sqlite --input tools/agent_sandbox/condien_state.json --save
          python tools/mpcp_papers.py --request tools/agent_sandbox/condien_paper.json --output local_workspace/ci-context/paper --condien-store local_workspace/ci-context/context.sqlite --condien-name EQUIPMENT-CONTEXT --condien-revision 1 --execute
      - name: Keep execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpcp-agent-sandbox-evidence
          path: |
            local_workspace/ci-sandbox
            local_workspace/ci-papers
            local_workspace/ci-context
          if-no-files-found: warn
