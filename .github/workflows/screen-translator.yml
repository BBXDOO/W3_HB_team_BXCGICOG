name: Screen Translator APK
on:
  pull_request:
    paths:
      - 'w3_tool_store/screen_translator/**'
      - 'w3_tool_store/agent_workbench/tools/android_apk_probe/**'
      - '.github/workflows/screen-translator.yml'
  push:
    branches: ['feat/screen-translator-th', 'refactor/v0.2']
    paths:
      - 'w3_tool_store/screen_translator/**'
      - 'w3_tool_store/agent_workbench/tools/android_apk_probe/**'
      - '.github/workflows/screen-translator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: w3_tool_store/screen_translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Inspect actual APK using Workbench
        run: python ../agent_workbench/tools/android_apk_probe/probe.py app/build/outputs/apk/debug/app-debug.apk --output app/build/reports/apk-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W3-Screen-Translator-preview-build
          path: |
            w3_tool_store/screen_translator/app/build/outputs/apk/debug/*.apk
            w3_tool_store/screen_translator/app/build/reports/
          if-no-files-found: error
