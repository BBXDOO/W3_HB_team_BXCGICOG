name: CROLL

on:
  push:
    branches:
      - refactor/v0.2
    paths:
      - "croll/**"
      - "protocol/**"
      - ".github/workflows/croll.yml"

  pull_request:
    branches:
      - refactor/v0.2
    paths:
      - "croll/**"
      - "protocol/**"
      - ".github/workflows/croll.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-croll:
    name: Validate CROLL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CROLL files
        run: |
          echo "CROLL workflow started"
          find croll -maxdepth 3 -type f 2>/dev/null || true
          find protocol -maxdepth 3 -type f | head -80

      - name: Validate markdown files
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("croll"),
              Path("protocol"),
          ]

          checked = 0
          missing_title = []

          for root in targets:
              if not root.exists():
                  continue

              for path in root.rglob("*.md"):
                  checked += 1
                  text = path.read_text(encoding="utf-8", errors="ignore").strip()
                  if not text.startswith("#"):
                      missing_title.append(str(path))

          print(f"checked_markdown={checked}")

          if missing_title:
              print("Markdown files without heading:")
              for item in missing_title:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

      - name: Validate Python syntax
        run: |
          python -m compileall croll protocol
