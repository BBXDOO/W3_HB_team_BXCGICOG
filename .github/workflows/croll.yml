name: CROLL

on:
  push:
    branches:
      - refactor/v0.2
    paths:
      - "croll/**"
      - "protocol/**"
      - ".github/workflows/croll.yml"

  pull_request:
    branches:
      - refactor/v0.2
    paths:
      - "croll/**"
      - "protocol/**"
      - ".github/workflows/croll.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-croll:
    name: Validate CROLL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CROLL files
        run: |
          echo "CROLL workflow started"
          find croll -maxdepth 3 -type f 2>/dev/null || true
          find protocol -maxdepth 3 -type f | head -80

      # Documentation shape is advisory. CROLL must not block valid system
      # changes merely because a Markdown file does not use a heading.
      # Semantic/logic review belongs to the verification layer (for example
      # Gemini); this workflow keeps only deterministic CI checks as gates.
      - name: Review markdown shape (advisory)
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [Path("croll"), Path("protocol")]
          checked = 0
          review = []

          for root in targets:
              if not root.exists():
                  continue

              for path in root.rglob("*.md"):
                  checked += 1
                  text = path.read_text(encoding="utf-8", errors="ignore").strip()
                  if not text.startswith("#"):
                      review.append(str(path))

          print(f"checked_markdown={checked}")
          if review:
              print("REVIEW: Markdown files without a leading heading:")
              for item in review:
                  print(f"- {item}")
              print("Advisory only: send semantic/structure questions to verification review.")
          PY

      # Syntax remains a hard deterministic boundary: malformed Python cannot
      # safely enter the CROLL/protocol execution or planning surface.
      - name: Validate Python syntax
        run: |
          python -m compileall -q croll protocol
