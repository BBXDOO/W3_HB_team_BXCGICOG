name: IGET PR Analyzer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  iget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run IGET
        run: |
          python iget/main.py > result.txt

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: result.txt
