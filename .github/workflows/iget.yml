name: IGET v7.0

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (for manual run)"
        required: false

concurrency:
  group: iget-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  iget:
    name: "IGET v7.0 — Semantic PR Governance"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Verify iget structure
        run: |
          echo "── iget package check ──"
          python -c "import iget; print('iget import: OK')"
          echo "── proof module check ──"
          python -c "from iget.proof import ProofTracer; print('ProofTracer: OK')"
          echo "── scorer check ──"
          python -c "from iget.scorer import get_semantic_state; print('semantic_state: OK')"

      - name: Run test suite
        run: |
          echo "── IGET v7.0 Test Suite ──"
          python -m iget.tests.test_iget_v7
        continue-on-error: false

      - name: Run IGET v7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          echo "── Running IGET v7.0 pipeline ──"
          python -m iget.main
