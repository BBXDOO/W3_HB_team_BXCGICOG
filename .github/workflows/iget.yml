name: IGET

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: iget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  iget:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install requests

      - name: Run IGET
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python -m iget.main
