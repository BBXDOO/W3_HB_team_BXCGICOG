name: IGET v9

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to analyze
        required: true
        type: number

concurrency:
  group: iget-v9-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  iget:
    name: Analyze PR with IGET v9
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    timeout-minutes: 5

    steps:
      # pull_request_target intentionally checks out trusted base-branch code only.
      # IGET reads changed-file metadata through the API and never executes PR code.
      - name: Checkout trusted IGET runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            iget/requirements.txt
            iget/requirements-dev.txt

      - name: Install IGET v9
        run: python -m pip install --disable-pip-version-check -r iget/requirements-dev.txt

      - name: Verify trusted IGET runtime
        run: python -m pytest iget/tests -q

      - name: Run IGET v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_API_URL: ${{ github.api_url }}
          IGET_HTTP_TIMEOUT: "20"
          IGET_INLINE_COMMENTS: "false"
        run: python -m iget.main
