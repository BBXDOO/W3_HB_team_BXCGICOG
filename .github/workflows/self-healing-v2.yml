name: Self Healing System v2

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  detect-and-heal:
    runs-on: ubuntu-latest

    steps:
      - name: Get workflow run logs
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;

            const logs = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id
            });

            const fs = require('fs');
            fs.writeFileSync('logs.zip', Buffer.from(logs.data));

      - name: Unzip logs
        run: unzip logs.zip -d logs

      - name: Scan logs
        id: scan
        run: |
          echo "Scanning logs..."

          WARNING_COUNT=$(grep -i "deprecated" -r logs | wc -l || true)
          ERROR_COUNT=$(grep -i "error" -r logs | wc -l || true)

          echo "warnings=$WARNING_COUNT" >> $GITHUB_OUTPUT
          echo "errors=$ERROR_COUNT" >> $GITHUB_OUTPUT

      - name: Classify result
        id: classify
        run: |
          WARN=${{ steps.scan.outputs.warnings }}
          ERR=${{ steps.scan.outputs.errors }}

          if [ "$ERR" -gt 0 ]; then
            echo "level=critical" >> $GITHUB_OUTPUT
          elif [ "$WARN" -gt 0 ]; then
            echo "level=warning" >> $GITHUB_OUTPUT
          else
            echo "level=clean" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue (if needed)
        if: steps.classify.outputs.level != 'clean'
        uses: actions/github-script@v7
        with:
          script: |
            const level = "${{ steps.classify.outputs.level }}";
            const warnings = "${{ steps.scan.outputs.warnings }}";
            const errors = "${{ steps.scan.outputs.errors }}";

            const title = `🚨 ${level.toUpperCase()} detected in deployment`;
            const body = `
            ## Self-Healing Report

            Level: ${level}
            Warnings: ${warnings}
            Errors: ${errors}

            Detected from workflow logs.

            Action:
            - Review logs
            - Fix root cause
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Auto PR for warnings
        if: steps.classify.outputs.level == 'warning'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/fix-warning
          title: "🔧 Auto Fix: Warning detected"
          commit-message: "chore: investigate warnings"
          body: |
            Warning detected in workflow logs.

            Suggested actions:
            - Update deprecated dependencies
            - Review workflow configuration
