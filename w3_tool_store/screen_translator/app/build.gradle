plugins { id 'com.android.application' }
// Passwords are read directly from the step's secret environment, never GITHUB_ENV/OUTPUT.
def privateSigning = [:]
def signingInput = System.getenv('INPUT_SIGNING_JSON')
if (signingInput) {
    try { privateSigning = new groovy.json.JsonSlurper().parseText(signingInput) }
    catch (Exception ignored) { throw new GradleException('Invalid private signing configuration') }
    if (!(privateSigning instanceof Map)) throw new GradleException('Invalid private signing configuration')
}
def keyFile = System.getenv('W3_RELEASE_KEYSTORE_FILE')
def releaseStorePassword = privateSigning.store_password ?: System.getenv('W3_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = privateSigning.key_alias ?: System.getenv('W3_RELEASE_KEY_ALIAS')
def releaseKeyPassword = privateSigning.key_password ?: System.getenv('W3_RELEASE_KEY_PASSWORD')
def signedRelease = [keyFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }
android {
    namespace 'org.w3.translate'
    compileSdk 35
    defaultConfig { applicationId 'org.w3.translate.preview'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.5-preview'; ndk { abiFilters 'arm64-v8a' } }
    if (signedRelease) {
        signingConfigs { channel { storeFile file(keyFile); storePassword releaseStorePassword; keyAlias releaseKeyAlias; keyPassword releaseKeyPassword } }
    }
    buildTypes { release { minifyEnabled false; if (signedRelease) signingConfig signingConfigs.channel } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation 'junit:junit:4.13.2'
}
