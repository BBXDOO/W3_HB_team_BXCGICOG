plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('W3_RELEASE_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('W3_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('W3_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('W3_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace 'com.w3personalsandbox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.w3personalsandbox.app'
        minSdk 24
        targetSdk 35
        versionCode 51
        versionName '0.51'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            personalRelease {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.personalRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
