plugins { id 'com.android.application' }

android {
    namespace 'com.w3personalsandbox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.w3personalsandbox.app'
        minSdk 24
        targetSdk 35
        versionCode 39
        versionName '0.39'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
