<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ซ่อมไฟล์ออฟไลน์ · Personal Sandbox</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a17; color: #edf5f0; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(90vw, 520px); padding: 24px; border: 1px solid #517b68; border-radius: 18px; background: #1d2b24; }
    button { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: #26a77c; color: #07120d; font-weight: 800; font-size: 16px; }
    button:disabled { opacity: .5; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    a { color: #92f2cb; }
  </style>
</head>
<body><main>
  <h1>ซ่อมแอปออฟไลน์</h1>
  <p>เปิดหน้านี้ขณะ Termux รัน <code>bash start.sh</code> ใน Chrome โปรไฟล์ที่ใช้แอปอยู่ การซ่อมจะเปลี่ยนเฉพาะไฟล์แอปที่ Chrome เก็บไว้ ไม่ลบโครงการหรือรูปพื้นหลัง</p>
  <button id="repair">ซ่อมและเก็บรุ่นล่าสุด</button>
  <p id="status" role="status">พร้อมซ่อม</p>
  <p><a href="./?v=32">กลับไปแอป</a></p>
</main>
<script>
  const button = document.getElementById('repair');
  const status = document.getElementById('status');
  button.onclick = async () => {
    button.disabled = true;
    try {
      if (!('serviceWorker' in navigator) || !('caches' in window)) throw new Error('Chrome นี้ไม่รองรับไฟล์ออฟไลน์');
      const root = new URL('./', location.href);
      const probe = await fetch(new URL(`index.html?repair=${Date.now()}`, root), { cache: 'no-store' });
      if (!probe.ok) throw new Error('เซิร์ฟเวอร์ยังไม่พร้อม กรุณาเปิด Termux และรัน bash start.sh');
      status.textContent = 'กำลังติดตั้งตัวเก็บหน้า v32 (เก็บแคชเดิมไว้จนกว่าจะสำเร็จ)…';
      const registration = await navigator.serviceWorker.register(new URL('sw.js?v=32', root).href, { updateViaCache: 'none' });
      const deadline = Date.now() + 30000;
      let ready = false;
      while (Date.now() < deadline) {
        const worker = registration.active;
        const cache = await caches.open('w3-personal-shell-v32');
        const page = await cache.match(root.href);
        const files = await cache.keys();
        if (worker?.scriptURL.includes('v=32') && page && files.some(request => request.url.includes('/assets/') && request.url.endsWith('.js')) && files.some(request => request.url.includes('/assets/') && request.url.endsWith('.css'))) {
          ready = true; break;
        }
        await new Promise(resolve => setTimeout(resolve, 400));
      }
      if (!ready) throw new Error(`ยังติดตั้งไม่ครบ: worker=${registration.active?.scriptURL || 'ไม่มี'} cache=${(await caches.keys()).filter(name => name.startsWith('w3-personal-shell-')).join(', ') || 'ไม่มี'} กรุณาเปิด Termux ค้างไว้`);
      status.textContent = 'พร้อมใช้รุ่น v32 ออฟไลน์แล้ว เปิดแอปจากลิงก์ด้านล่างได้เลย จากนั้นค่อยปิด Termux เพื่อทดสอบ';
    } catch (error) {
      status.textContent = `ซ่อมยังไม่สำเร็จ: ${error.message}`;
    } finally { button.disabled = false; }
  };
</script></body></html>
