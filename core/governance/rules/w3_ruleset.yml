# W3 Agent CI Ruleset
# Path: core/governance/rules/w3_ruleset.yml
#
# Each rule has:
#   id          : unique rule identifier  (e.g. W3-001)
#   title       : short human-readable name
#   severity    : error | warn | info
#   description : what the rule checks and why it matters
#   check       : internal key used by the orchestrator to run the check
#   override:
#     allowed         : true | false  (can a PR author request an override?)
#     requires_reason : true | false  (must the override include a non-empty reason?)

rules:

  - id: W3-001
    title: "Python compile check"
    severity: error
    description: >
      All Python files in the repository must compile without syntax errors.
      A compilation failure indicates broken code that cannot be imported or executed.
    check: python_compile
    override:
      allowed: false
      requires_reason: false

  - id: W3-002
    title: "Module JSON validation"
    severity: error
    description: >
      All module.json files must contain the required fields (name, display_name,
      version, owner, input, output, scope) and pass structural validation.
      Invalid module manifests break the module loader and routing.
    check: validate_modules
    override:
      allowed: false
      requires_reason: false

  - id: W3-003
    title: "Governance metadata validation"
    severity: error
    description: >
      Markdown files in team-member directories must comply with governance metadata
      rules. Specifically, if 'approved-by' is present then 'reason' must also be
      present.  Missing reason fields indicate unapproved or untracked changes.
    check: validate_metadata
    override:
      allowed: true
      requires_reason: true

  - id: W3-004
    title: "JSON schema validation"
    severity: warn
    description: >
      Every *.schema.json file that has a matching *.json data file must validate
      successfully. Schema mismatches indicate data drift or schema rot.
    check: validate_json_schemas
    override:
      allowed: true
      requires_reason: true
